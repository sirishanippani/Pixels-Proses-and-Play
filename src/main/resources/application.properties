# Profile-agnostic defaults. DB-specific settings live in
# application-{local,mysql,postgres}.properties.

spring.application.name=blog
spring.profiles.active=local

# Hibernate validates; Flyway owns schema changes.
spring.jpa.hibernate.ddl-auto=validate

# Service transactions are the only JPA session boundary. Lazy loads during
# view rendering fail fast with LazyInitializationException so missing fetch
# plans are visible, not hidden behind per-row N+1 queries.
spring.jpa.open-in-view=false

# Vendor-specific migrations: Flyway substitutes {vendor} with the detected
# database type (h2, mysql, postgresql) at startup.
spring.flyway.locations=classpath:db/migration/{vendor}

profile.upload.dir=uploads

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# i18n: messages.properties on classpath, UTF-8 for accented and emoji-era copy.
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Actuator: expose only /actuator/health. Other endpoints (env, beans, mappings,
# heapdump, loggers) leak internals and stay disabled. Health shows {"status":"UP"}
# only — no component-level detail to unauthenticated callers.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
