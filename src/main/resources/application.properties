# Profile-agnostic defaults. DB-specific settings live in
# application-{local,mysql,postgres}.properties.

spring.application.name=blog
spring.profiles.active=local

# Hibernate validates; Flyway owns schema changes.
spring.jpa.hibernate.ddl-auto=validate

# Vendor-specific migrations: Flyway substitutes {vendor} with the detected
# database type (h2, mysql, postgresql) at startup.
spring.flyway.locations=classpath:db/migration/{vendor}

profile.upload.dir=uploads

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
