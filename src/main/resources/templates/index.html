<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Pixels, Proses & Play')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/flash :: flash}"></div>

<main class="container">

    <!-- Hero -->
    <section class="hero">
        <h1 class="hero-title" id="tagline">Write like no one's debugging.</h1>
        <p class="hero-subtitle">A quiet corner of the internet for pixels, prose, and the occasional play.</p>
        <a th:href="@{/post/create}" class="btn btn-primary">Start writing</a>
    </section>

    <!-- Featured -->
    <section th:if="${featuredPosts != null and !featuredPosts.isEmpty()}">
        <h2 class="section-heading">Featured</h2>
        <div class="post-grid">
            <a th:each="post : ${featuredPosts}"
               th:href="@{/post/{id}(id=${post.id})}"
               class="post-card text-decoration-none">
                <h3 class="card-title" th:text="${post.title}">Post title</h3>
                <p class="card-text"
                   th:text="${post.summary.length() > 140 ? post.summary.substring(0, 140) + '…' : post.summary}">
                    Summary preview.
                </p>
                <div class="card-meta">
                    <span class="byline" th:text="${post.authorUsername}">Author</span>
                    <span th:text="${#temporals.format(post.createdAt, 'dd MMM yyyy')}">Date</span>
                </div>
            </a>
        </div>
    </section>

    <!-- Recent -->
    <section>
        <h2 class="section-heading">Recently published</h2>

        <div th:if="${recentPosts != null and !recentPosts.isEmpty()}" class="post-grid">
            <a th:each="post : ${recentPosts}"
               th:href="@{/post/{id}(id=${post.id})}"
               class="post-card text-decoration-none">
                <h3 class="card-title" th:text="${post.title}">Post title</h3>
                <p class="card-text"
                   th:text="${post.summary.length() > 160 ? post.summary.substring(0, 160) + '…' : post.summary}">
                    Summary preview.
                </p>
                <div th:if="${not #lists.isEmpty(post.tagNames)}" class="mt-2 mb-2">
                    <span th:each="tagName : ${post.tagNames}" class="tag" th:text="${tagName}">tag</span>
                </div>
                <div class="card-meta">
                    <span>By <span class="byline" th:text="${post.authorUsername}">author</span></span>
                    <span th:text="${#temporals.format(post.createdAt, 'dd MMM yyyy')}">Date</span>
                </div>
            </a>
        </div>

        <div th:if="${recentPosts == null or recentPosts.isEmpty()}" class="empty-state">
            No posts yet. The page is waiting.
        </div>
    </section>

    <div style="height: var(--s-8)"></div>
</main>

<script>
    const taglines = [
        "Write like no one's debugging.",
        "Blog it before you forget it.",
        "Got thoughts? Spin them into words.",
        "Ideas deserve their own domain."
    ];
    const taglineEl = document.getElementById("tagline");
    let current = 0;
    setInterval(() => {
        current = (current + 1) % taglines.length;
        taglineEl.textContent = taglines[current];
    }, 5000);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
