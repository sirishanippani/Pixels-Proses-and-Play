<!-- templates/profile.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('@' + ${user.username} + ' · Pixels, Proses & Play')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/flash :: flash}"></div>

<main class="container">
    <section class="profile-header">
        <div class="avatar-wrapper">
            <img class="avatar"
                 th:src="${user.profileImage != null ? '/images/profile/' + user.profileImage : '/images/default-avatar.png'}"
                 alt="Profile picture">
            <form th:if="${isOwner}" th:action="@{/profile/upload}" method="post" enctype="multipart/form-data"
                  style="margin: 0;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label class="avatar-edit" title="Change profile picture">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h9"/>
                        <path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                    </svg>
                    <input type="file" name="image" accept="image/jpeg,image/png,image/webp" hidden
                           onchange="this.form.submit()">
                </label>
            </form>
        </div>

        <div>
            <h1 class="profile-username" th:text="'@' + ${user.username}">@username</h1>
            <p class="profile-bio"
               th:text="${user.bio != null and !#strings.isEmpty(user.bio) ? user.bio : 'No bio yet.'}">
                Bio.
            </p>
        </div>

        <div th:if="${isOwner}">
            <a th:href="@{/profile/edit}" class="btn btn-outline-secondary">Edit profile</a>
        </div>
    </section>

    <section>
        <h2 class="section-heading">Posts</h2>
        <div th:if="${#lists.isEmpty(posts)}" class="empty-state">
            Nothing published yet.
        </div>
        <ul th:if="${!#lists.isEmpty(posts)}" class="post-list">
            <li th:each="post : ${posts}">
                <a th:href="@{'/post/' + ${post.id}}" th:text="${post.title}">Post title</a>
            </li>
        </ul>
    </section>

    <div style="height: var(--s-8)"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
