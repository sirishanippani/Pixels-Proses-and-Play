<!-- templates/admin_dashboard.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Admin · Pixels, Proses & Play')}"></head>
<body>
<script th:if="${forceLogout}" th:inline="javascript">
    setTimeout(() => { window.location.href = '/logout'; }, 1600);
</script>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/flash :: flash}"></div>

<main class="container">
    <h1 style="margin-top: var(--s-7);">Admin</h1>
    <p style="color: var(--muted); margin-bottom: var(--s-6);">
        Signed in as <span class="byline" th:text="${admin}">admin</span>.
    </p>

    <h2 class="section-heading">Users</h2>
    <table class="admin-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Email</th>
            <th>Username</th>
            <th>Role</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}">1</td>
            <td th:text="${user.email}">user@example.com</td>
            <td th:text="${user.username}">username</td>
            <td><span class="role-badge" th:text="${user.role}">ROLE_USER</span></td>
            <td>
                <div class="cell-actions">
                    <form th:action="@{'/admin/user/delete/' + ${user.id}}" method="post" style="margin: 0;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-outline-secondary btn-sm"
                                onclick="return confirm('Delete this user?')">Delete</button>
                    </form>
                    <form th:action="@{'/admin/user/toggle-role/' + ${user.id}}" method="post" style="margin: 0;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-outline-secondary btn-sm"
                                onclick="return confirm('Toggle this user’s role?')">Toggle role</button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <h2 class="section-heading">Posts</h2>
    <table class="admin-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="post : ${posts}">
            <td th:text="${post.id}">1</td>
            <td><a th:href="@{/post/{id}(id=${post.id})}" th:text="${post.title}">Title</a></td>
            <td th:text="${post.user.username}">author</td>
            <td>
                <form th:action="@{'/admin/post/delete/' + ${post.id}}" method="post" style="margin: 0;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button class="btn btn-outline-secondary btn-sm"
                            onclick="return confirm('Delete this post?')">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div style="height: var(--s-8)"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
