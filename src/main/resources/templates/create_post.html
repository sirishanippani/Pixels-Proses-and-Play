<!-- templates/create_post.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('New post · Pixels, Proses & Play')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/flash :: flash}"></div>

<main class="container" style="max-width: 720px;">
    <h1 style="margin-top: var(--s-7);">New post</h1>
    <p style="color: var(--muted); margin-bottom: var(--s-6);">Write what you'd want to read.</p>

    <form id="postForm" th:action="@{/post/create}" th:object="${postForm}" method="post" novalidate>
        <div class="form-group" style="margin-bottom: var(--s-5);">
            <label class="form-label" for="title">Title</label>
            <input type="text" id="title" th:field="*{title}" class="form-control"
                   th:errorclass="is-invalid" placeholder="Give it a name">
            <div class="invalid-feedback" th:errors="*{title}"></div>
        </div>

        <div class="form-group" style="margin-bottom: var(--s-5);">
            <label class="form-label" for="tagInput">Tags</label>
            <input type="text" id="tagInput" th:field="*{tagInput}" class="form-control"
                   th:errorclass="is-invalid" placeholder="comma, separated, tags">
            <div class="invalid-feedback" th:errors="*{tagInput}"></div>
        </div>

        <div class="form-group" style="margin-bottom: var(--s-5);">
            <label class="form-label">Body</label>
            <div id="toast-editor"></div>
            <input type="hidden" th:field="*{content}" id="content">
            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('content')}"
                 th:errors="*{content}"></div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Publish</button>
            <a th:href="@{/dashboard}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>

    <div style="height: var(--s-8)"></div>
</main>

<link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css">
<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const editor = new toastui.Editor({
            el: document.querySelector('#toast-editor'),
            height: '420px',
            initialEditType: 'markdown',
            previewStyle: 'vertical',
            hideModeSwitch: false,
            initialValue: document.querySelector('#content')?.value || ''
        });
        document.querySelector('#postForm').addEventListener('submit', () => {
            document.querySelector('#content').value = editor.getHTML();
        });
    });
</script>
</body>
</html>
