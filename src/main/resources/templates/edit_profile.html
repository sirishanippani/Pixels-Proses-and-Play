<!-- templates/edit_profile.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Edit profile · Pixels, Proses & Play')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/flash :: flash}"></div>

<main class="container" style="max-width: 560px;">
    <h1 style="margin-top: var(--s-7);">Edit profile</h1>
    <p style="color: var(--muted); margin-bottom: var(--s-6);">Who you are, in your own words.</p>

    <form th:action="@{/profile/edit}" th:object="${profileForm}" method="post" novalidate>
        <div class="form-group" style="margin-bottom: var(--s-5);">
            <label class="form-label" for="username">Display name</label>
            <input type="text" id="username" th:field="*{username}" class="form-control"
                   th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{username}"></div>
        </div>

        <div class="form-group" style="margin-bottom: var(--s-5);">
            <label class="form-label" for="bio">Bio</label>
            <textarea id="bio" th:field="*{bio}" class="form-control" rows="5"
                      th:errorclass="is-invalid"
                      placeholder="A line or two about you."></textarea>
            <div class="invalid-feedback" th:errors="*{bio}"></div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save changes</button>
            <a th:href="@{'/profile/' + ${currentUsername}}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>

    <div style="height: var(--s-8)"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
