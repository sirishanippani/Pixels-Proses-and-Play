<!-- templates/register.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Create account · Pixels, Proses & Play')}"></head>
<body>
<div class="auth-shell">
    <aside class="auth-art">
        <div class="auth-art-inner">
            <img th:src="@{/images/logo-alt.png}" alt="">
            <h2 class="auth-art-title">Start writing.</h2>
            <p class="auth-art-text">Pick a name, drop an email, and your corner of the page is ready.</p>
        </div>
    </aside>

    <section class="auth-panel">
        <div class="auth-card">
            <h1>Create account</h1>
            <p class="auth-sub">Welcome in.</p>

            <form th:action="@{/register}" th:object="${registerRequest}" method="post" novalidate>
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" th:field="*{username}" class="form-control"
                           th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{username}"></div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control"
                           th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control"
                           th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{password}"></div>
                </div>
                <button type="submit" class="btn btn-primary">Create account</button>
            </form>

            <p class="auth-footer">
                Already here? <a th:href="@{/login}">Sign in</a>.
            </p>
        </div>
    </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
