<!-- templates/login.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Sign in · Pixels, Proses & Play')}"></head>
<body>
<div class="auth-shell">
    <aside class="auth-art">
        <div class="auth-art-inner">
            <img th:src="@{/images/logo-alt.png}" alt="">
            <h2 class="auth-art-title">Welcome back.</h2>
            <p class="auth-art-text">The page missed you. Sign in and pick up where you left off.</p>
        </div>
    </aside>

    <section class="auth-panel">
        <div class="auth-card">
            <h1>Sign in</h1>
            <p class="auth-sub">Enter the portal.</p>

            <form th:action="@{/login}" method="post" novalidate>
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="form-group">
                    <label class="form-label" for="username">Email</label>
                    <input type="email" id="username" name="username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">Sign in</button>
            </form>

            <div th:if="${param.error}" class="auth-error">
                That didn't work. Double-check your email and password, or
                <a th:href="@{/register}">create an account</a>.
            </div>

            <p class="auth-footer">
                First time here? <a th:href="@{/register}">Create an account</a>.
            </p>
        </div>
    </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
