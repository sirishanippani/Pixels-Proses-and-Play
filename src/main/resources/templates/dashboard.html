<!-- templates/dashboard.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Dashboard · Pixels, Proses & Play')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/flash :: flash}"></div>

<main class="container">
    <div class="d-flex justify-content-between align-items-center" style="margin: var(--s-7) 0 var(--s-5);">
        <h1 style="margin: 0;">Your posts</h1>
        <a th:href="@{/post/create}" class="btn btn-primary">New post</a>
    </div>

    <div th:if="${posts.empty}" class="empty-state">
        Nothing here yet. Start writing — the page is waiting.
    </div>

    <div th:if="${!posts.empty}" class="post-grid">
        <div th:each="post : ${posts}" class="post-card">
            <a th:href="@{/post/{id}(id=${post.id})}" class="text-decoration-none">
                <h3 class="card-title" th:text="${post.title}">Post title</h3>
                <p class="card-text"
                   th:text="${post.summary.length() > 160 ? post.summary.substring(0, 160) + '…' : post.summary}">
                    Summary preview.
                </p>
                <div th:if="${not #lists.isEmpty(post.tagNames)}" class="mt-2 mb-2">
                    <span th:each="tagName : ${post.tagNames}" class="tag" th:text="${tagName}">tag</span>
                </div>
            </a>
            <div class="d-flex justify-content-between align-items-center"
                 style="margin-top: var(--s-4); padding-top: var(--s-3); border-top: 1px solid var(--border);">
                <a th:href="@{/post/edit/{id}(id=${post.id})}" class="btn btn-outline-secondary btn-sm">Edit</a>
                <form th:action="@{/post/delete/{id}(id=${post.id})}" method="post"
                      onsubmit="return confirm('Delete this post? There is no coming back from it.');"
                      style="margin: 0;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-outline-secondary btn-sm">Delete</button>
                </form>
            </div>
        </div>
    </div>

    <div style="height: var(--s-8)"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
