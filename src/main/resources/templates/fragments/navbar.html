<!-- fragments/navbar.html -->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<div th:fragment="navbar">
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">
                <img th:src="@{/images/logo-alt.png}" alt="" aria-hidden="true" />
                <span>Pixels, Proses &amp; Play</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('USER')">
                        <a class="nav-link" th:href="@{/post/create}">Write</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/admin}">Admin</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAnonymous()">
                        <a class="nav-link" th:href="@{/login}">Sign in</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAnonymous()">
                        <a class="nav-link" th:href="@{/register}">Join</a>
                    </li>

                    <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false">
                            <span class="byline" th:text="${#authentication.principal.username}">Username</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li>
                                <span class="dropdown-item disabled">
                                    Signed in as <span class="byline" th:text="${#authentication.principal.username}">Username</span>
                                </span>
                            </li>
                            <li><a class="dropdown-item"
                                   th:href="@{'/profile/' + ${#authentication.principal.username}}">Profile</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="m-0">
                                    <button type="submit" class="dropdown-item">Sign out</button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </ul>

                <form class="d-flex ms-lg-3 my-2 my-lg-0 position-relative" role="search" onsubmit="return false;">
                    <input class="form-control" type="search" id="search-input"
                           placeholder="Search posts…" aria-label="Search">
                    <ul id="search-suggestions" class="list-group position-absolute mt-2 w-100"
                        style="top: 100%; z-index: 1000;"></ul>
                </form>

                <button id="themeToggle" class="theme-toggle ms-lg-3 my-2 my-lg-0"
                        type="button" aria-label="Toggle color theme">
                    <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <script>
        (function () {
            // Search suggestions
            const input = document.getElementById('search-input');
            const suggestions = document.getElementById('search-suggestions');
            if (input) {
                input.addEventListener('input', async () => {
                    const query = input.value.trim();
                    if (!query) { suggestions.innerHTML = ''; return; }
                    const res = await fetch(`/search?q=${encodeURIComponent(query)}`);
                    const data = await res.json();
                    suggestions.innerHTML = data.length === 0
                        ? `<li class='list-group-item text-muted'>Nothing matches yet.</li>`
                        : data.map(post =>
                            `<li class='list-group-item'><a href='/post/${post.id}'>${post.title}</a></li>`
                          ).join('');
                });
                document.addEventListener('click', (e) => {
                    if (!input.contains(e.target) && !suggestions.contains(e.target)) {
                        suggestions.innerHTML = '';
                    }
                });
            }

            // Theme toggle — [data-theme="dark"] on <html> wins over prefers-color-scheme.
            const root = document.documentElement;
            const toggle = document.getElementById('themeToggle');
            const icon = document.getElementById('themeIcon');

            const sunPath = 'M12 3v2M12 19v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42';
            const sunCircle = { cx: 12, cy: 12, r: 4 };
            const moonPath = 'M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z';

            function renderIcon(mode) {
                if (!icon) return;
                if (mode === 'dark') {
                    icon.innerHTML = `<circle cx="${sunCircle.cx}" cy="${sunCircle.cy}" r="${sunCircle.r}"/><path d="${sunPath}"/>`;
                } else {
                    icon.innerHTML = `<path d="${moonPath}"/>`;
                }
            }

            function currentMode() {
                const explicit = root.getAttribute('data-theme');
                if (explicit) return explicit;
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }

            // Initialize from storage or system preference
            const saved = localStorage.getItem('theme');
            if (saved === 'dark' || saved === 'light') {
                root.setAttribute('data-theme', saved);
            }
            renderIcon(currentMode());

            if (toggle) {
                toggle.addEventListener('click', () => {
                    const next = currentMode() === 'dark' ? 'light' : 'dark';
                    root.setAttribute('data-theme', next);
                    localStorage.setItem('theme', next);
                    renderIcon(next);
                });
            }
        })();
    </script>
</div>
</html>
