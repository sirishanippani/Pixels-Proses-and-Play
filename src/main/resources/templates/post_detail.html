<!-- templates/post_detail.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${post.title})}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/flash :: flash}"></div>

<article class="post-wrapper">
    <h1 class="post-title" th:text="${post.title}">Post title</h1>

    <div class="post-meta">
        <span>By <a th:href="@{'/profile/' + ${post.user.username}}" class="byline"
                    th:text="${post.user.username}">author</a></span>
        <span class="separator">·</span>
        <span th:text="${#temporals.format(post.createdAt, 'dd MMM yyyy')}">Date</span>
    </div>

    <div th:if="${not #lists.isEmpty(post.tags)}" class="mb-3">
        <span th:each="tag : ${post.tags}" class="tag" th:text="${tag.name}">tag</span>
    </div>

    <div class="rich-content" th:utext="${post.content}"></div>

    <div class="post-actions"
         th:if="${currentUser != null and (currentUser.id == post.user.id or currentUser.role?.equals('ADMIN'))}">
        <a th:href="@{/post/edit/{id}(id=${post.id})}" class="btn btn-outline-secondary">Edit</a>
        <form th:action="@{/post/delete/{id}(id=${post.id})}" method="post"
              onsubmit="return confirm('Delete this post? There is no coming back from it.');"
              style="margin: 0;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-outline-secondary">Delete</button>
        </form>
    </div>
</article>

<section class="comments-section">
    <h2 class="comments-heading">Comments</h2>

    <div th:if="${#lists.isEmpty(comments)}" class="empty-state">
        No comments yet. Be the first voice in the room.
    </div>

    <div th:each="comment : ${comments}" class="comment">
        <div>
            <span class="comment-author" th:text="${comment.user.username}">author</span>
            <span class="comment-time" th:text="${#temporals.format(comment.createdAt, 'dd MMM yyyy · HH:mm')}">time</span>
        </div>
        <p class="comment-body" th:text="${comment.content}">Comment content.</p>
        <form th:if="${loggedInUser != null and comment.user.id == loggedInUser.id}"
              th:action="@{/comment/{id}/delete(id=${comment.id})}" method="post"
              style="margin: 0;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="comment-delete">Delete</button>
        </form>
    </div>

    <div th:if="${loggedInUser != null}" style="margin-top: var(--s-6);">
        <form th:action="@{/post/{id}/comment(id=${post.id})}" th:object="${commentForm}" method="post" novalidate>
            <div class="form-group">
                <label class="form-label" for="comment-content">Your thoughts</label>
                <textarea id="comment-content" th:field="*{content}" class="form-control"
                          th:errorclass="is-invalid" rows="4"
                          placeholder="Say something nice. Or at least say something."></textarea>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('content')}"
                     th:errors="*{content}"></div>
            </div>
            <button type="submit" class="btn btn-primary">Post comment</button>
        </form>
    </div>

    <div th:if="${loggedInUser == null}" style="margin-top: var(--s-5); color: var(--muted); font-size: var(--fs-sm);">
        <a th:href="@{/login}">Sign in</a> to leave a comment.
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
