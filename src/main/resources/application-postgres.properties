# PostgreSQL profile. Target for Phase 7 deployment (Neon + Render).
# DATABASE_URL from the hosting provider will be a jdbc:postgresql://... URL;
# DATABASE_USERNAME / DATABASE_PASSWORD come from Neon's connection details.

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/blogdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.show-sql=false

# Render injects the port it wants the app to bind on via $PORT. Local compose
# and other hosts can override via SERVER_PORT; default stays 8080 so smoke
# scripts keep working unchanged.
server.port=${PORT:8080}

# Graceful shutdown: when Render sends SIGTERM during a redeploy, Tomcat stops
# accepting new requests but lets in-flight ones finish (up to the timeout
# below) before the JVM exits. Without this, active users get connection
# reset mid-request during every deploy.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# HikariCP pool sized for Render's 512MB free instance. Default pool-size=10
# is wasteful here and spikes Neon's free-tier CU-hours. Neon scales to zero
# after 5 min idle, so minimum-idle=0 lets the pool fully release when the app
# is quiet (idle-timeout=4min keeps us under Neon's auto-suspend window).
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=240000
spring.datasource.hikari.connection-timeout=10000
