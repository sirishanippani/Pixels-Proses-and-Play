# PostgreSQL profile. Target for Phase 7 deployment (Neon + Render).
# DATABASE_URL from the hosting provider will be a jdbc:postgresql://... URL;
# DATABASE_USERNAME / DATABASE_PASSWORD come from Neon's connection details.

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/blogdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.show-sql=false
