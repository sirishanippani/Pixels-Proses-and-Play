# Flash messages. Voice: cozy-editorial with occasional slang.
# See CLAUDE.md "Phase 6.5" for the full voice spec.

# Posts
post.created=Posted. You're in your writer era.
post.updated=Edits saved. Clean.
post.deleted=Post gone. We never read it.
post.ownership.denied=Not your post, bestie.

# Comments
comment.posted=Said.
comment.deleted=Comment erased. We'll forget we saw it.
comment.ownership.denied=Not your comment, bestie.

# Profile
profile.updated=Main character era, continued.
profile.image.updated=New pfp just dropped.
profile.image.empty=File? What file?
profile.image.unsupported=That one didn't make the cut — we take jpeg, png, webp.
profile.image.failed=The upload took an L. Try again?

# Admin
admin.user.deleted=User cleared. The archive remembers.
admin.post.deleted=Post vaporized. We don't speak of it.
admin.user.role.toggled=Role flipped. It's giving character development.
admin.user.role.toggled.self=Role flipped. Log out and re-enter to feel it.
