# MySQL 8+ profile. For legacy / self-hosted MySQL deployments.
# Expects DATABASE_URL / DATABASE_USERNAME / DATABASE_PASSWORD env vars in prod.

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/blogdb}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.show-sql=false
